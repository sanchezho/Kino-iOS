# Kino iOS — unsigned IPA build (PRIMARY build route).
#
# The owner explicitly chose GitHub Actions as the build route; a local
# Mac/Xcode compile is only a fallback. Every push to main and every
# manual run produces an unsigned .ipa artifact for Signulous re-signing.
#
# Runner: macos-26 (GitHub-hosted). Xcode: 26.4+ (SwiftVLC needs
# swift-tools 6.3, which Xcode 16 on macos-15 cannot build). The step
# below picks the newest installed Xcode 26.4/26.5/26.6; that path is
# checked, not assumed to exist.
#
# v3 changes (2026-11-07): runs #1–#3 all failed in the `xcodebuild
# archive` step in ~8s with only "exit code 65" visible. `xcodebuild
# -list` passes, so the scheme is fine; the archive action itself is
# the suspect (it demands a signing identity even for an unsigned
# build). This version builds instead of archiving: `xcodebuild build
# -sdk iphoneos` with CODE_SIGNING_ALLOWED=NO produces an unsigned
# .app, which is zipped into Payload/ as the .ipa — the standard way
# to make an unsigned IPA in CI. The build log's error lines and tail
# are written into the job summary, visible without signing in.
name: iOS

"on":
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          # Phase 4b: SwiftVLC needs swift-tools 6.3 → Xcode 26.4+.
          # Pick the newest installed 26.4/26.5/26.6; fall back to the
          # runner default (which must itself be >= 26.4 on this image).
          xcodebuild -version
          SELECTED=""
          for v in 26.6 26.5 26.4; do
            if [ -d "/Applications/Xcode_$v.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_$v.app"
              SELECTED="$v"
              echo "Selected Xcode $v"
              break
            fi
          done
          if [ -z "$SELECTED" ]; then
            echo "No Xcode 26.4+ app found; using the runner default Xcode"
            ls /Applications | grep -i xcode || true
          fi
          xcodebuild -version
          swift --version

      - name: List schemes
        run: |
          xcodebuild -list -project KinoiOS.xcodeproj | tee scheme-list.txt
          {
            echo "## Schemes and targets"
            echo '```'
            cat scheme-list.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Phase 4: build libtorrent (2.1.2.0, pinned SHA 6da363d) for the
      # vendored LibTorrent-Swift wrapper. Cached across runs.
      - name: Install libtorrent build deps
        run: |
          brew install boost
          cmake --version
        # libtorrent CMakeLists requires Boost (find_public_dependency).
        # cmake is preinstalled on macOS runners; the version line proves it.
        # If a later step reports OpenSSL not found, add `brew install openssl`.

      - name: Restore libtorrent build cache
        id: libtorrent-cache
        uses: actions/cache@v6
        with:
          path: Thirdparty/LibTorrent-Swift/libtorrent-build
          key: libtorrent-v2-${{ runner.os }}-${{ runner.arch }}-6da363d2994f17c0b3c0450d124cf73a31a73847-${{ hashFiles('Thirdparty/LibTorrent-Swift/LibTorrent/**', 'Thirdparty/LibTorrent-Swift/make.sh') }}
          # exact-match key only (like iTorrent's); a different toolchain or
          # wrapper revision must rebuild, never restore a stale .a.
          # v2 (2026-11-07, Phase 4b): toolchain moved Xcode 16 → 26.4
          # with the macos-15 → macos-26 runner change, so the .a built
          # under v1 must not be reused.

      - name: Clone libtorrent sources
        run: |
          if [ ! -d Thirdparty/LibTorrent-Swift/Thirdparty/libtorrent ]; then
            mkdir -p Thirdparty/LibTorrent-Swift/Thirdparty
            git init Thirdparty/LibTorrent-Swift/Thirdparty/libtorrent
            git -C Thirdparty/LibTorrent-Swift/Thirdparty/libtorrent remote add origin https://github.com/arvidn/libtorrent.git
            git -C Thirdparty/LibTorrent-Swift/Thirdparty/libtorrent fetch --depth 1 origin 6da363d2994f17c0b3c0450d124cf73a31a73847
            git -C Thirdparty/LibTorrent-Swift/Thirdparty/libtorrent checkout FETCH_HEAD
            # libtorrent needs its git submodules (deps/try_signal etc.);
            # without them CMake fails at "Cannot find source file:
            # deps/try_signal/try_signal.cpp" (run #15).
            git -C Thirdparty/LibTorrent-Swift/Thirdparty/libtorrent submodule update --init --depth 1
            test -f Thirdparty/LibTorrent-Swift/Thirdparty/libtorrent/deps/try_signal/try_signal.cpp || { echo "ERROR: try_signal submodule still empty"; exit 1; }
          fi
          # Headers for the app build come from this clone; the .a below
          # comes from the build (or the cache). Pinned: libtorrent 2.1.2.0,
          # RC_2_1 commit 6da363d2994f17c0b3c0450d124cf73a31a73847.

      - name: Configure + build libtorrent (cache miss only)
        if: steps.libtorrent-cache.outputs.cache-hit != 'true'
        run: |
          set +e
          cd Thirdparty/LibTorrent-Swift && zsh make.sh > ../../libtorrent-build.log 2>&1
          MAKE_CODE=$?
          cmake --build libtorrent-build --config Release -- -sdk iphoneos >> ../../libtorrent-build.log 2>&1
          BUILD_CODE=$?
          find libtorrent-build -name "*.a" | head >> ../../libtorrent-build.log 2>&1
          ls -lh libtorrent-build/Release-iphoneos/ >> ../../libtorrent-build.log 2>&1 || true
          {
            echo "## libtorrent build result"
            echo "make.sh exit code: $MAKE_CODE"
            echo "cmake --build exit code: $BUILD_CODE"
            echo "### Error lines"
            echo '```'
            grep -i -m 60 "error" ../../libtorrent-build.log || echo "(no error lines found)"
            echo '```'
            echo "### Last 40 lines"
            echo '```'
            tail -n 40 ../../libtorrent-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MAKE_CODE" -ne 0 ]; then exit $MAKE_CODE; fi
          exit $BUILD_CODE

      - name: Build (unsigned)
        run: |
          set +e
          xcodebuild build \
            -project KinoiOS.xcodeproj \
            -scheme KinoiOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" > build.log 2>&1
          CODE=$?
          echo "xcodebuild exit code: $CODE"
          {
            echo "## Build result"
            echo "exit code: $CODE"
            echo "### Error lines"
            echo '```'
            grep -i -m 60 "error:" build.log || echo "(no error: lines found)"
            echo '```'
            echo "### Last 40 lines of build log"
            echo '```'
            tail -n 40 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $CODE

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/KinoiOS.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "KinoiOS.app not found after build"
            find build -maxdepth 4 -name "*.app" -o -maxdepth 4 -name "Products" || true
            exit 1
          fi
          rm -rf Payload KinoiOS-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -r KinoiOS-unsigned.ipa Payload
          ls -lh KinoiOS-unsigned.ipa
          /usr/bin/unzip -l KinoiOS-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: KinoiOS-unsigned-ipa
          path: KinoiOS-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload libtorrent build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libtorrent-build-log
          path: libtorrent-build.log
          if-no-files-found: warn
