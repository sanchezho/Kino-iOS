# Phase 4 step 1 — workflow addition for .github/workflows/ios.yml
#
# HOW TO APPLY (user-maintained file — Muse cannot push .github/workflows/):
# insert these four steps in the `build` job AFTER the "List schemes" step
# and BEFORE the existing "Build (unsigned)" step. Everything else in
# ios.yml stays as-is. The steps assume the repo checkout already contains
# the vendored wrapper (Thirdparty/LibTorrent-Swift/, pushed with the
# Phase 4 step 1 snapshot); only the C++ libtorrent tree is cloned here.
#
# TWO CORRECTIONS vs PHASE4-TORRENT-PLAN.md §4.2 (verified 2026-11-07):
# 1. The cache step now has `id: libtorrent-cache`, and the build step's
#    `if:` references `steps.libtorrent-cache.outputs.cache-hit` — the plan
#    left a `<cache-step-id>` placeholder that would not evaluate.
# 2. The clone step does NOT do `git clone --depth 1` + `checkout <sha>`:
#    a depth-1 clone of the default branch does not contain the pinned
#    RC_2_1 commit 6da363d (2026-09-24), so that checkout would fail.
#    Instead it fetches exactly the pinned commit
#    (`git fetch --depth 1 origin <sha>`; GitHub serves arbitrary SHAs).
#
# Expected result on the first run: libtorrent-build/Release-iphoneos/
# libtorrent-rasterbar.a exists (the `find` line proves the path the
# pbxproj links), then the normal unsigned build compiles the vendored
# wrapper + TorrentEngine stub against it.

      - name: Install libtorrent build deps
        run: |
          brew install boost
          cmake --version
        # libtorrent CMakeLists requires Boost (find_public_dependency).
        # cmake is preinstalled on macOS runners; the version line proves it.
        # If a later step reports OpenSSL not found, add `brew install openssl`.

      - name: Restore libtorrent build cache
        id: libtorrent-cache
        uses: actions/cache@v6
        with:
          path: Thirdparty/LibTorrent-Swift/libtorrent-build
          key: libtorrent-v1-${{ runner.os }}-${{ runner.arch }}-6da363d2994f17c0b3c0450d124cf73a31a73847-${{ hashFiles('Thirdparty/LibTorrent-Swift/LibTorrent/**', 'Thirdparty/LibTorrent-Swift/make.sh') }}
          # exact-match key only (like iTorrent's); a different toolchain or
          # wrapper revision must rebuild, never restore a stale .a.

      - name: Clone libtorrent sources
        run: |
          if [ ! -d Thirdparty/LibTorrent-Swift/Thirdparty/libtorrent ]; then
            mkdir -p Thirdparty/LibTorrent-Swift/Thirdparty
            git init Thirdparty/LibTorrent-Swift/Thirdparty/libtorrent
            git -C Thirdparty/LibTorrent-Swift/Thirdparty/libtorrent remote add origin https://github.com/arvidn/libtorrent.git
            git -C Thirdparty/LibTorrent-Swift/Thirdparty/libtorrent fetch --depth 1 origin 6da363d2994f17c0b3c0450d124cf73a31a73847
            git -C Thirdparty/LibTorrent-Swift/Thirdparty/libtorrent checkout FETCH_HEAD
          fi
          # Headers for the app build come from this clone; the .a below
          # comes from the build (or the cache). Pinned: libtorrent 2.1.2.0,
          # RC_2_1 commit 6da363d2994f17c0b3c0450d124cf73a31a73847.

      - name: Configure + build libtorrent (cache miss only)
        if: steps.libtorrent-cache.outputs.cache-hit != 'true'
        run: |
          cd Thirdparty/LibTorrent-Swift && ./make.sh
          cmake --build libtorrent-build --config Release -- -sdk iphoneos
          # Expected output: libtorrent-build/Release-iphoneos/libtorrent-rasterbar.a
          # (the path the pbxproj links). Verify with the find below.
          find libtorrent-build -name "*.a" | head
          ls -lh libtorrent-build/Release-iphoneos/ || true
